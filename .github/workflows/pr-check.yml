name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint check
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

      - name: Run lint
        run: ./gradlew lintDevDebug

      - name: Check for TODO comments
        run: |
          if grep -r "TODO\|FIXME\|HACK" app/src/main/; then
            echo "Found TODO/FIXME/HACK comments in main code"
            exit 1
          fi

      - name: Check for hardcoded strings
        run: |
          if grep -r "hardcoded\|magic" app/src/main/; then
            echo "Found potential hardcoded values"
            exit 1
          fi

      - name: Check for proper error handling
        run: |
          if grep -r "catch.*Exception" app/src/main/; then
            echo "Found generic exception handling"
            exit 1
          fi

  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests with coverage
        run: ./gradlew testDevDebugUnitTest jacocoTestReport

      - name: Check test coverage
        run: |
          # Check if test coverage meets minimum requirements
          COVERAGE=$(./gradlew jacocoTestReport | grep -o 'Coverage: [0-9]*%' | grep -o '[0-9]*')
          if [ "$COVERAGE" -lt 80 ]; then
            echo "Test coverage is below 80%: $COVERAGE%"
            exit 1
          fi
          echo "Test coverage: $COVERAGE%"

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run dependency check
        run: ./gradlew dependencyCheckAnalyze

      - name: Check for hardcoded secrets
        run: |
          if grep -r -i "password\|secret\|key\|token" app/src/main/ | grep -v "// TODO\|// FIXME"; then
            echo "Found potential hardcoded secrets"
            exit 1
          fi

      - name: Check for proper ProGuard rules
        run: |
          if [ ! -f "app/proguard-rules.pro" ]; then
            echo "ProGuard rules file not found"
            exit 1
          fi
